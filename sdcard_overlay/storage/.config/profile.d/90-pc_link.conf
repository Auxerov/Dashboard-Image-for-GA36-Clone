# -------------------------------------------------------------
# GA36 / R36S Automatic USB PC Link Boot Hook (Profile.d)
# Safe, non-blocking single-execution daemon
# -------------------------------------------------------------

if mkdir /tmp/.r36s_link_lock 2>/dev/null; then
    (
        echo "GA36 PC Link Boot Hook Triggered: $(date)" > /storage/usb_boot.log

        # 0. Immediately paint custom cyber splash to framebuffer 0 (0.005s instant paint)
        if [ -f /storage/pc_link/splash.raw ]; then
            cat /storage/pc_link/splash.raw > /dev/fb0 2>/dev/null || true
        elif [ -f /storage/.config/splash/splash.raw ]; then
            cat /storage/.config/splash/splash.raw > /dev/fb0 2>/dev/null || true
        elif [ -f /storage/.config/splash/splash-1080.raw ]; then
            cat /storage/.config/splash/splash-1080.raw > /dev/fb0 2>/dev/null || true
        fi

        # 1. Run USB Gadget Setup
        if [ -f /storage/pc_link/usb_gadget_setup.sh ]; then
            /bin/bash /storage/pc_link/usb_gadget_setup.sh >> /storage/usb_boot.log 2>&1
        elif [ -f /storage/roms/pc_display/usb_gadget_setup.sh ]; then
            /bin/bash /storage/roms/pc_display/usb_gadget_setup.sh >> /storage/usb_boot.log 2>&1
        fi

        # 2. Wait up to 5 seconds for serial device
        SERIAL_DEV=""
        for i in $(seq 1 25); do
            for cand in /dev/ttyGS0 /dev/ttygserial /dev/ttyGS* /dev/ttyACM*; do
                if [ -e "$cand" ]; then
                    SERIAL_DEV="$cand"
                    break 2
                fi
            done
            sleep 0.2
        done
        echo "Detected Serial Device: '$SERIAL_DEV'" >> /storage/usb_boot.log

        # 3. Launch Agent Daemon (Serial + TCP port 8888)
        AGENT=""
        if [ -f /storage/pc_link/r36s_agent.py ]; then
            AGENT="/storage/pc_link/r36s_agent.py"
        elif [ -f /storage/roms/pc_display/r36s_agent.py ]; then
            AGENT="/storage/roms/pc_display/r36s_agent.py"
        fi

        if [ -n "$AGENT" ]; then
            echo "Launching $AGENT..." >> /storage/usb_boot.log
            DEV_ARG="${SERIAL_DEV:-/dev/ttyGS0}"
            python3 "$AGENT" --daemon --dev "$DEV_ARG" --port 8888 >> /storage/usb_boot.log 2>&1 &
            echo "Agent PID: $!" >> /storage/usb_boot.log
        fi
        sync
    ) >/dev/null 2>&1 &
fi
